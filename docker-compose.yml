version: '3'

services:
  hadoop:
    build: .
    container_name: hadoop-node
    ports:
      - "9870:9870"  # NameNode Web UI
      - "8088:8088"  # ResourceManager Web UI
      - "9864:9864"  # DataNode Web UI
    volumes:
      - hadoop_data:/hadoop_data
    restart: unless-stopped

volumes:
  hadoop_data: 